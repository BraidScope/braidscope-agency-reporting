    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Braidscope",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.braidscope.cloud/",
        "description": "Client reporting for marketing agencies. One workspace per client, dashboards from Google Ads, Meta Ads, GA4, HubSpot and Klaviyo, Ask AI, branded PDF reports.",
        "publisher": { "@type": "Organization", "name": "AI Data House", "url": "https://braidscope.com/" }
      }
    </script>
    <!-- No favicon by default - shows nothing until a signed-in organization
         uploads its own via Branding. The href is a genuinely valid,
         transparent 1x1 PNG (not the bare "data:," this used before) -
         browsers that fail to decode a malformed/empty data URI tend to
         silently keep showing whatever favicon they'd already cached for
         this origin instead of clearing it, which a real (if invisible)
         image avoids. Its mere presence as an explicit <link rel="icon">
         also stops browsers from auto-requesting /favicon.ico on their own
         (which they otherwise do whenever no icon link is present at all) -
         that file still exists on disk (web/public/favicon.ico) for later
         use, it's just not wired up as an automatic fallback right now.
         Single managed tag by design: the dynamic favicon effect in
         App.jsx updates this exact element (by id) rather than adding a
         second competing <link rel="icon">, so there's never ambiguity
         about which icon (or lack of one) a browser should use. -->
    <link id="app-favicon" rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Pinned to an exact version (not @latest) — jsdelivr's @latest tag was
         resolving inconsistently across requests, sometimes serving a CSS
         build missing icons (e.g. ti-plug-connected, ti-chart-bar) that a
         freshly-fetched @latest response did include, so some glyphs would
         render blank depending on which cached response a given page load
         happened to get. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.documentElement;
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const initialTheme = prefersDark ? "dark" : "light";
        root.setAttribute("data-theme", initialTheme);
        root.classList.toggle("dark", prefersDark);
      })();
    </script>
    <!-- Runtime settings for self-host images (empty on cloud, see web/docker-entrypoint.d). -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
