name: ci

# Required checks for the main-protect ruleset (BS-018). Job names are the
# check contexts the ruleset lists: lint, unit, build, gitleaks, zizmor, DCO.
# Runs on GitHub-hosted runners only. The self-hosted runner is for deploy.
#
# Every `uses:` is pinned to a full commit SHA with the tag in a comment.
# Third-party tools are installed through package managers with pinned
# versions (pip, go install) instead of third-party actions.

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Starts with the rules that catch real breakage (syntax errors, undefined
    # names, bad comparisons). Widen the rule set in its own PR once the
    # existing code is clean against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Ruff (rule set in py/pyproject.toml)
        run: ruff check py

  unit:
    runs-on: ubuntu-latest
    env:
      # Tests never reach the network. These values only satisfy module-level
      # configuration checks so every test file can import.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      # Codex tests mock the subprocess; the CLI only needs to resolve on PATH.
      CODEX_CLI_COMMAND: "true"
      GIT_COMMIT: ci
      # The suite posts to rate-limited routes many times in one minute; the
      # limiter has its own tests that re-enable it explicitly.
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py/requirements.txt
      - name: Install Python dependencies
        working-directory: py
        run: pip install -r requirements.txt
      - name: Python tests
        working-directory: py
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Web tests
        working-directory: web
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build web
        working-directory: web
        env:
          VITE_GIT_COMMIT: ci
        run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q py/app
      - name: Validate compose files
        # `compose config` refuses to run if an env_file path is missing. The
        # runner has neither the repo .env nor the server's staging env file,
        # so create empty placeholders for the check. Nothing reads them.
        run: |
          touch .env
          sudo mkdir -p /home/deploy/braidscope-staging
          sudo touch /home/deploy/braidscope-staging/.env.staging
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci

  gitleaks:
    # Scans the commits this PR or push adds, not the whole history. The
    # full-history scan is a one-time job (BS-007). Installing through the Go
    # module proxy gives checksum verification without a third-party action
    # and without a licence key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No usable base commit; scanning the head commit only."
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$BASE_SHA..$HEAD_SHA"
          fi
          echo "Scanning $RANGE"
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--no-merges $RANGE" .

  audit:
    # Advisory: known vulnerabilities in dependencies. Reports as warnings,
    # never fails the job. Dependabot opens the fix PRs; this job makes the
    # state visible on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: npm audit (web)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=npm audit::production dependencies have known vulnerabilities, see the step log"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: pip-audit (py)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r py/requirements.txt --strict || echo "::warning title=pip-audit::Python dependencies have known vulnerabilities, see the step log"

  zizmor:
    # Static analysis of the workflow files themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: pip install zizmor==1.31.1
      - name: Audit workflows
        run: zizmor --offline --no-progress .github/workflows

  DCO:
    # Every commit a PR adds must carry a Signed-off-by trailer (git commit -s).
    # This is the Developer Certificate of Origin check named in CONTRIBUTING.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $c has no Signed-off-by trailer. Use: git commit -s"
              missing=1
            fi
          done
          exit $missing
